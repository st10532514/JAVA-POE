name: TestJava

# Runs the JUnit tests every time code is pushed or a pull request is opened
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # All "run" steps execute inside the NetBeans project folder.
    # Local path: C:\Users\Student\Documents\NetBeansProjects\JAVA-POE\JavaApplication
    # On the runner this is the JavaApplication folder inside the repository (JAVA-POE).
    defaults:
      run:
        working-directory: JavaApplication

    steps:
      # 1. Download the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install JDK 25 (should match javac.source / javac.target in project.properties)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 3. Ant is NOT bundled with the JDK on GitHub runners, so install it.
      #    ant-optional provides ant-junit.jar so Ant can run the <junit> task
      #    (there is no separate "ant-junit" package on Ubuntu 24.04).
      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant ant-optional

      # 4. NetBeans keeps its JUnit jars inside the IDE, which the runner does not have.
      #    Download JUnit 4 and Hamcrest so the tests can compile and run.
      - name: Download JUnit 4 and Hamcrest
        run: |
          mkdir -p ci-libs
          curl -sSL -o ci-libs/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o ci-libs/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      # 5. Compile and run all tests.
      #    lib/json-simple-1.1.1.jar must be committed to the repo.
      - name: Run tests with Ant
        run: >
          ant clean test
          -Dlibs.junit.classpath=ci-libs/junit-4.13.2.jar:ci-libs/hamcrest-core-1.3.jar
          -Dlibs.junit_4.classpath=ci-libs/junit-4.13.2.jar:ci-libs/hamcrest-core-1.3.jar

      # 6. Keep the test reports so you can open them from the Actions tab
      #    (path is relative to the repo root, so the folder name is included)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: JavaApplication/build/test/results
